name: Git Vertag
author: kyoh86
description: Put new git tag for next semantic version
branding:
  icon: at-sign
  color: gray-dark
inputs:
  method:
    description: |
      Which number to increment in the semantic versioning.
      Set 'major', 'minor', 'patch', 'get' or 'validate'.
    required: true
  tag:
    description: |
      Tag to validate when method is 'validate'.
      If omitted, validates tags pointing at HEAD.
    required: false
  push:
    description: |
      If the new tag should be pushed, set "true".
    required: false
    default: 'false'
outputs:
  vertag:
    description: Semantic version tag from the selected method
runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.method }}
    - ${{ inputs.push }}
    - ${{ inputs.tag }}
